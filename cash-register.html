<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBE - Resume du jour</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="container cash-register-page">
    <div class="lang-switch"><a class="legal-link" href="index.html">Retour a la caisse</a></div>
    <div class="content">
      <section class="category z-report">
        <h2>Resume du jour / Z</h2>
        <div class="menu-grid">
          <div class="z-legal"><strong>CUBE</strong><br>7 rue Blanche, 75009 Paris<br>SIRET 928 586 973 00010 | TVA FR83 928586973</div>
          <div id="businessDate"></div>
          <div id="totals"></div>
          <button class="z-print-button" id="printZ" type="button">Imprimer le Z</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    let day;
    const euro = (value) => `EUR ${Number(value || 0).toFixed(2)}`;

    async function loadReport() {
      const res = await fetch('/api/cash-register', { credentials: 'same-origin' });
      if (res.status === 401) return window.location.href = 'admin.html?next=cash-register.html';
      const report = await res.json();
      if (!res.ok) return alert(report.error || 'Lecture du resume impossible');
      day = report.day;
      document.getElementById('businessDate').textContent = day
        ? `Service commence : ${new Date(day.opened_at).toLocaleString('fr-FR')}`
        : 'Aucun service enregistre';
      document.getElementById('totals').innerHTML = `
        Operations : ${report.events.length}<br>
        Especes : ${euro(report.totals.cash)}<br>
        Carte : ${euro(report.totals.card)}<br>
        Titres-restaurant : ${euro(report.totals.meal_voucher)}<br>
        Autre : ${euro(report.totals.other)}
      `;
    }

    document.getElementById('printZ').onclick = () => {
      try {
        window.print();
      } catch {
        // A print failure must not block access to the completed day summary.
      }
    };

    loadReport();
  </script>
</body>
</html>
