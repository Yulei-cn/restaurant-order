<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBE 订单面板</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e0ea;
      --text: #1e293b;
      --muted: #64748b;
      --green: #0f9d58;
      --blue: #2563eb;
      --orange: #ea580c;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
    }

    .status-badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .connected {
      background: #dcfce7;
      color: #166534;
    }

    .disconnected {
      background: #fee2e2;
      color: #991b1b;
    }

    .controls,
    .audio-controls {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .primary-btn {
      background: var(--blue);
      color: #fff;
    }

    .secondary-btn {
      background: #e2e8f0;
      color: var(--text);
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .audio-status {
      color: var(--muted);
      font-size: 14px;
    }

    .orders-grid {
      display: grid;
      gap: 16px;
    }

    .order-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .order-card.new-order {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.15);
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-number {
      font-size: 22px;
      font-weight: 700;
    }

    .order-meta,
    .order-extra {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 12px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-source {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill-payment {
      background: #fef3c7;
      color: #92400e;
    }

    .pill-status {
      background: #dcfce7;
      color: #166534;
    }

    .item-list {
      margin: 12px 0;
      padding-left: 18px;
    }

    .item-list li {
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn-confirm { background: #e0f2fe; color: #075985; }
    .btn-preparing { background: #ede9fe; color: #5b21b6; }
    .btn-ready { background: #ffedd5; color: #9a3412; }
    .btn-completed { background: #dcfce7; color: #166534; }

    .empty-state {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .order-number {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-block">
      <h1>订单接收面板</h1>
      <p>店内点单和外部点单将统一显示在这里</p>
    </div>
    <div id="connectionStatus" class="status-badge disconnected">未连接</div>
  </div>

  <div class="audio-controls">
    <strong>声音提醒</strong>
    <button id="enableAudioBtn" class="primary-btn" onclick="enableAudio()">启用声音提醒</button>
    <button id="testSoundBtn" class="secondary-btn" onclick="testSound()" disabled>测试提示音</button>
    <span id="audioStatus" class="audio-status">尚未启用</span>
    <audio id="alertSound" preload="auto">
      <source src="新订单.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="controls">
    <button class="primary-btn" onclick="loadOrders()">刷新订单</button>
    <button class="secondary-btn" onclick="toggleRealtime()">切换实时模式</button>
  </div>

  <div id="orders" class="orders-grid">
    <div class="empty-state">加载中...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const adminPassword = "88888888";
    const SUPABASE_URL = "https://jjkyltquurcuznukxakv.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KZezonRMvncSjXTgiSz-Kg_Ra2O4HhH";

    const input = prompt("请输入管理员密码");
    if (input !== adminPassword) {
      alert("密码错误，即将离开页面");
      window.location.href = "https://cube-paris.vercel.app/";
    }

    let supabase = null;
    let realtimeChannel = null;
    let isRealtimeMode = false;
    let isAudioEnabled = false;
    let audioContext = null;
    let pollingInterval = null;
    let lastOrderIds = new Set();

    function updateConnectionStatus(status, text) {
      const statusEl = document.getElementById("connectionStatus");
      statusEl.className = `status-badge ${status}`;
      statusEl.textContent = text;
    }

    function initRealtime() {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        isRealtimeMode = true;
        updateConnectionStatus("connected", "实时连接中");
      } catch (error) {
        console.warn("Supabase 初始化失败，改用轮询模式", error);
        updateConnectionStatus("disconnected", "轮询模式");
      }
    }

    function enableAudio() {
      const audio = document.getElementById("alertSound");
      const statusEl = document.getElementById("audioStatus");
      const testBtn = document.getElementById("testSoundBtn");

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      audio.volume = 1;
      const playPromise = audio.play();
      if (playPromise) {
        playPromise.then(() => {
          audio.pause();
          audio.currentTime = 0;
          isAudioEnabled = true;
          document.getElementById("enableAudioBtn").style.display = "none";
          testBtn.disabled = false;
          statusEl.textContent = "已启用";
        }).catch(() => {
          isAudioEnabled = true;
          testBtn.disabled = false;
          statusEl.textContent = "已启用（Web Audio）";
        });
      }
    }

    function playWebAudioAlert() {
      if (!audioContext || !isAudioEnabled) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playAlertSound() {
      if (!isAudioEnabled) return;

      const audio = document.getElementById("alertSound");
      audio.currentTime = 0;
      audio.play().catch(() => playWebAudioAlert());
    }

    function testSound() {
      playAlertSound();
    }

    function showNewOrderAlert() {
      playAlertSound();

      if (document.visibilityState === "hidden" && "Notification" in window && Notification.permission === "granted") {
        new Notification("收到新订单", {
          body: "请查看订单面板",
          icon: "logo.png"
        });
      }
    }

    function getSourceLabel(source) {
      if (source === "internal") return "店内";
      if (source === "online_paid") return "线上已支付";
      return "线上到店付款";
    }

    function getStatusLabel(status) {
      const labels = {
        new: "新订单",
        confirmed: "已确认",
        preparing: "制作中",
        ready: "可取餐",
        completed: "已完成",
        cancelled: "已取消"
      };
      return labels[status] || status;
    }

    function getPaymentLabel(status) {
      const labels = {
        unpaid: "未支付",
        pay_on_pickup: "到店付款",
        paid: "已支付",
        failed: "支付失败",
        refunded: "已退款"
      };
      return labels[status] || status;
    }

    async function updateOrderStatus(id, orderStatus) {
      try {
        const res = await fetch("/api/mark-printed", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, order_status: orderStatus })
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "状态更新失败");
        }

        loadOrders();
      } catch (error) {
        console.error("订单状态更新失败", error);
        alert("订单状态更新失败，请重试");
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders");
      container.innerHTML = "";

      if (!orders.length) {
        container.innerHTML = '<div class="empty-state">当前没有待处理订单</div>';
        return;
      }

      const thirtySecondsAgo = Date.now() - 30000;

      orders.forEach((order) => {
        const div = document.createElement("div");
        div.className = "order-card";

        if (new Date(order.created_at).getTime() > thirtySecondsAgo) {
          div.classList.add("new-order");
        }

        const items = Array.isArray(order.items) ? order.items : [];
        const itemHtml = items.length
          ? items.map((item) => `<li>${item.name} x${item.qty} - €${Number(item.total ?? item.price * item.qty).toFixed(2)}</li>`).join("")
          : "<li>无商品</li>";

        div.innerHTML = `
          <div class="order-head">
            <div>
              <div class="order-number">${order.order_number || "未生成订单号"}</div>
              <div class="order-meta">${new Date(order.created_at).toLocaleString("zh-CN")}</div>
            </div>
            <div class="order-extra">总价 €${Number(order.total_amount || 0).toFixed(2)}</div>
          </div>
          <div class="pill-row">
            <span class="pill pill-source">${getSourceLabel(order.source)}</span>
            <span class="pill pill-payment">${getPaymentLabel(order.payment_status)}</span>
            <span class="pill pill-status">${getStatusLabel(order.order_status)}</span>
          </div>
          <div class="order-extra">姓名：${order.customer_name || "未填写"}</div>
          <div class="order-extra">电话：${order.customer_phone || "无"}</div>
          <div class="order-extra">地址：${order.customer_address || "无"}</div>
          <div class="order-extra">备注：${order.customer_notes || "无"}</div>
          <ul class="item-list">${itemHtml}</ul>
          <div class="actions">
            <button class="btn-confirm" onclick="updateOrderStatus('${order.id}', 'confirmed')">确认</button>
            <button class="btn-preparing" onclick="updateOrderStatus('${order.id}', 'preparing')">制作中</button>
            <button class="btn-ready" onclick="updateOrderStatus('${order.id}', 'ready')">可取餐</button>
            <button class="btn-completed" onclick="updateOrderStatus('${order.id}', 'completed')">完成</button>
          </div>
        `;

        container.appendChild(div);
      });
    }

    async function loadOrdersIfChanged() {
      try {
        const res = await fetch("/api/list-orders");
        const orders = await res.json();
        const currentIds = new Set(orders.map((order) => order.id));
        const newOrders = [...currentIds].filter((id) => !lastOrderIds.has(id));

        if (newOrders.length > 0) {
          showNewOrderAlert();
        }

        const changed =
          currentIds.size !== lastOrderIds.size ||
          [...currentIds].some((id) => !lastOrderIds.has(id));

        if (changed) {
          lastOrderIds = currentIds;
          renderOrders(orders);
        }
      } catch (error) {
        console.error("检查订单变化失败", error);
        updateConnectionStatus("disconnected", "连接错误");
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch("/api/list-orders");
        const orders = await res.json();
        lastOrderIds = new Set(orders.map((order) => order.id));
        renderOrders(orders);
      } catch (error) {
        console.error("加载订单失败", error);
        document.getElementById("orders").innerHTML = '<div class="empty-state">加载订单失败，请检查网络或 API 配置</div>';
      }
    }

    function setupRealtimeSubscription() {
      if (!supabase) return;

      realtimeChannel = supabase
        .channel("orders-channel")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "orders" }, () => {
          showNewOrderAlert();
          loadOrders();
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "orders" }, () => {
          loadOrders();
        })
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            updateConnectionStatus("connected", "实时模式");
          } else if (status === "CHANNEL_ERROR") {
            updateConnectionStatus("disconnected", "轮询模式");
            startPolling();
          }
        });
    }

    function startPolling() {
      stopPolling();
      updateConnectionStatus("connected", "轮询模式");
      pollingInterval = setInterval(loadOrdersIfChanged, 3000);
    }

    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    function toggleRealtime() {
      if (isRealtimeMode && realtimeChannel) {
        realtimeChannel.unsubscribe();
        realtimeChannel = null;
        isRealtimeMode = false;
        startPolling();
      } else if (supabase) {
        stopPolling();
        isRealtimeMode = true;
        setupRealtimeSubscription();
      } else {
        alert("Supabase 未初始化，无法启用实时模式");
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadOrders();
      }
    });

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    initRealtime();
    loadOrders();

    if (isRealtimeMode) {
      setupRealtimeSubscription();
    } else {
      startPolling();
    }
  </script>
</body>
</html>
