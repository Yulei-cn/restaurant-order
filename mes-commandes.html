<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBE Order Panel</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e0ea;
      --text: #1e293b;
      --muted: #64748b;
      --blue: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
    }

    .status-badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .connected {
      background: #dcfce7;
      color: #166534;
    }

    .disconnected {
      background: #fee2e2;
      color: #991b1b;
    }

    .controls,
    .audio-controls {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .primary-btn {
      background: var(--blue);
      color: #fff;
    }

    .secondary-btn {
      background: #e2e8f0;
      color: var(--text);
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .audio-status {
      color: var(--muted);
      font-size: 14px;
    }

    .orders-grid {
      display: grid;
      gap: 16px;
    }

    .order-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .order-card.new-order {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.15);
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-number {
      font-size: 22px;
      font-weight: 700;
    }

    .order-meta,
    .order-extra {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 12px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-source {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill-payment {
      background: #fef3c7;
      color: #92400e;
    }

    .pill-status {
      background: #dcfce7;
      color: #166534;
    }

    .item-list {
      margin: 12px 0;
      padding-left: 18px;
    }

    .item-list li {
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn-confirm { background: #e0f2fe; color: #075985; }
    .btn-preparing { background: #ede9fe; color: #5b21b6; }
    .btn-ready { background: #ffedd5; color: #9a3412; }
    .btn-completed { background: #dcfce7; color: #166534; }

    .empty-state {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .order-number {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-block">
      <h1>Order Panel</h1>
      <p>Internal and online pickup orders appear here.</p>
    </div>
    <div id="connectionStatus" class="status-badge disconnected">Disconnected</div>
  </div>

  <div class="audio-controls">
    <strong>Audio</strong>
    <button id="enableAudioBtn" class="primary-btn" onclick="enableAudio()">Enable alert sound</button>
    <button id="testSoundBtn" class="secondary-btn" onclick="testSound()" disabled>Test sound</button>
    <span id="audioStatus" class="audio-status">Disabled</span>
    <audio id="alertSound" preload="auto">
      <source src="新订单.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="controls">
    <button class="primary-btn" onclick="loadOrders()">Refresh orders</button>
    <button class="secondary-btn" onclick="toggleRealtime()">Toggle realtime</button>
  </div>

  <div id="orders" class="orders-grid">
    <div class="empty-state">Loading...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const adminPassword = "88888888";
    const SUPABASE_URL = "https://jjkyltquurcuznukxakv.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KZezonRMvncSjXTgiSz-Kg_Ra2O4HhH";

    const input = prompt("Enter admin password");
    if (input !== adminPassword) {
      alert("Wrong password");
      window.location.href = "https://cube-paris.vercel.app/";
    }

    let supabase = null;
    let realtimeChannel = null;
    let isRealtimeMode = false;
    let isAudioEnabled = false;
    let audioContext = null;
    let pollingInterval = null;
    let lastOrderIds = new Set();

    function updateConnectionStatus(status, text) {
      const statusEl = document.getElementById("connectionStatus");
      statusEl.className = `status-badge ${status}`;
      statusEl.textContent = text;
    }

    function initRealtime() {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        isRealtimeMode = true;
        updateConnectionStatus("connected", "Realtime");
      } catch (error) {
        console.warn("Supabase init failed, fallback to polling", error);
        updateConnectionStatus("disconnected", "Polling");
      }
    }

    function enableAudio() {
      const audio = document.getElementById("alertSound");
      const statusEl = document.getElementById("audioStatus");
      const testBtn = document.getElementById("testSoundBtn");

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      audio.volume = 1;
      const playPromise = audio.play();
      if (playPromise) {
        playPromise.then(() => {
          audio.pause();
          audio.currentTime = 0;
          isAudioEnabled = true;
          document.getElementById("enableAudioBtn").style.display = "none";
          testBtn.disabled = false;
          statusEl.textContent = "Enabled";
        }).catch(() => {
          isAudioEnabled = true;
          testBtn.disabled = false;
          statusEl.textContent = "Enabled (Web Audio)";
        });
      }
    }

    function playWebAudioAlert() {
      if (!audioContext || !isAudioEnabled) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playAlertSound() {
      if (!isAudioEnabled) return;
      const audio = document.getElementById("alertSound");
      audio.currentTime = 0;
      audio.play().catch(() => playWebAudioAlert());
    }

    function testSound() {
      playAlertSound();
    }

    function showNewOrderAlert() {
      playAlertSound();

      if (document.visibilityState === "hidden" && "Notification" in window && Notification.permission === "granted") {
        new Notification("New order", {
          body: "Check the order panel",
          icon: "logo.png"
        });
      }
    }

    function getSourceLabel(source) {
      if (source === "internal") return "Internal";
      if (source === "online_paid") return "Online paid";
      return "Pickup payment";
    }

    function getStatusLabel(status) {
      const labels = {
        new: "New",
        confirmed: "Confirmed",
        preparing: "Preparing",
        ready: "Ready",
        completed: "Completed",
        cancelled: "Cancelled"
      };
      return labels[status] || status;
    }

    function getPaymentLabel(status) {
      const labels = {
        unpaid: "Unpaid",
        pay_on_pickup: "Pay on pickup",
        paid: "Paid",
        failed: "Failed",
        refunded: "Refunded"
      };
      return labels[status] || status;
    }

    async function updateOrderStatus(id, orderStatus) {
      try {
        const res = await fetch("/api/mark-printed", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, order_status: orderStatus })
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Status update failed");
        }

        loadOrders();
      } catch (error) {
        console.error("Order status update failed", error);
        alert("Order status update failed");
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders");
      container.innerHTML = "";

      if (!orders.length) {
        container.innerHTML = '<div class="empty-state">No active orders</div>';
        return;
      }

      const thirtySecondsAgo = Date.now() - 30000;

      orders.forEach((order) => {
        const div = document.createElement("div");
        div.className = "order-card";

        if (new Date(order.created_at).getTime() > thirtySecondsAgo) {
          div.classList.add("new-order");
        }

        const items = Array.isArray(order.items) ? order.items : [];
        const itemHtml = items.length
          ? items.map((item) => `<li>${item.name} x${item.qty} - EUR ${Number(item.total ?? item.price * item.qty).toFixed(2)}</li>`).join("")
          : "<li>No items</li>";

        div.innerHTML = `
          <div class="order-head">
            <div>
              <div class="order-number">${order.order_number || "No number"}</div>
              <div class="order-meta">${new Date(order.created_at).toLocaleString("fr-FR")}</div>
            </div>
            <div class="order-extra">Total EUR ${Number(order.total_amount || 0).toFixed(2)}</div>
          </div>
          <div class="pill-row">
            <span class="pill pill-source">${getSourceLabel(order.source)}</span>
            <span class="pill pill-payment">${getPaymentLabel(order.payment_status)}</span>
            <span class="pill pill-status">${getStatusLabel(order.order_status)}</span>
          </div>
          <div class="order-extra">Customer: ${order.customer_name || "-"}</div>
          <div class="order-extra">Phone: ${order.customer_phone || "-"}</div>
          <div class="order-extra">Address: ${order.customer_address || "-"}</div>
          <div class="order-extra">Notes: ${order.customer_notes || "-"}</div>
          <ul class="item-list">${itemHtml}</ul>
          <div class="actions">
            <button class="btn-confirm" onclick="updateOrderStatus('${order.id}', 'confirmed')">Confirm</button>
            <button class="btn-preparing" onclick="updateOrderStatus('${order.id}', 'preparing')">Preparing</button>
            <button class="btn-ready" onclick="updateOrderStatus('${order.id}', 'ready')">Ready</button>
            <button class="btn-completed" onclick="updateOrderStatus('${order.id}', 'completed')">Complete</button>
          </div>
        `;

        container.appendChild(div);
      });
    }

    async function loadOrdersIfChanged() {
      try {
        const res = await fetch("/api/list-orders");
        const orders = await res.json();
        const currentIds = new Set(orders.map((order) => order.id));
        const newOrders = [...currentIds].filter((id) => !lastOrderIds.has(id));

        if (newOrders.length > 0) {
          showNewOrderAlert();
        }

        const changed =
          currentIds.size !== lastOrderIds.size ||
          [...currentIds].some((id) => !lastOrderIds.has(id));

        if (changed) {
          lastOrderIds = currentIds;
          renderOrders(orders);
        }
      } catch (error) {
        console.error("Order polling failed", error);
        updateConnectionStatus("disconnected", "Error");
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch("/api/list-orders");
        const orders = await res.json();
        lastOrderIds = new Set(orders.map((order) => order.id));
        renderOrders(orders);
      } catch (error) {
        console.error("Order load failed", error);
        document.getElementById("orders").innerHTML = '<div class="empty-state">Order loading failed</div>';
      }
    }

    function setupRealtimeSubscription() {
      if (!supabase) return;

      realtimeChannel = supabase
        .channel("orders-channel")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "orders" }, () => {
          showNewOrderAlert();
          loadOrders();
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "orders" }, () => {
          loadOrders();
        })
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            updateConnectionStatus("connected", "Realtime");
          } else if (status === "CHANNEL_ERROR") {
            updateConnectionStatus("disconnected", "Polling");
            startPolling();
          }
        });
    }

    function startPolling() {
      stopPolling();
      updateConnectionStatus("connected", "Polling");
      pollingInterval = setInterval(loadOrdersIfChanged, 3000);
    }

    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    function toggleRealtime() {
      if (isRealtimeMode && realtimeChannel) {
        realtimeChannel.unsubscribe();
        realtimeChannel = null;
        isRealtimeMode = false;
        startPolling();
      } else if (supabase) {
        stopPolling();
        isRealtimeMode = true;
        setupRealtimeSubscription();
      } else {
        alert("Supabase is not available");
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadOrders();
      }
    });

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    initRealtime();
    loadOrders();

    if (isRealtimeMode) {
      setupRealtimeSubscription();
    } else {
      startPolling();
    }
  </script>
</body>
</html>
