<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBE Order Panel</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e0ea;
      --text: #1e293b;
      --muted: #64748b;
      --blue: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .connected {
      background: #dcfce7;
      color: #166534;
    }

    .disconnected {
      background: #fee2e2;
      color: #991b1b;
    }

    .controls,
    .audio-controls {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .poll-note {
      color: var(--muted);
      font-size: 13px;
      margin-left: auto;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .primary-btn {
      background: var(--blue);
      color: #fff;
    }

    .secondary-btn {
      background: #e2e8f0;
      color: var(--text);
    }

    .lang-btn.active {
      background: #cbd5e1;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .audio-status {
      color: var(--muted);
      font-size: 14px;
    }

    .orders-grid {
      display: grid;
      gap: 16px;
    }

    .order-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .order-card.new-order {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.15);
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-number {
      font-size: 22px;
      font-weight: 700;
    }

    .order-meta,
    .order-extra {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 12px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-source {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill-payment {
      background: #fef3c7;
      color: #92400e;
    }

    .pill-status {
      background: #dcfce7;
      color: #166534;
    }

    .item-list {
      margin: 12px 0;
      padding-left: 18px;
    }

    .item-list li {
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn-confirm { background: #e0f2fe; color: #075985; }
    .btn-preparing { background: #ede9fe; color: #5b21b6; }
    .btn-ready { background: #ffedd5; color: #9a3412; }
    .btn-completed { background: #dcfce7; color: #166534; }

    .empty-state {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .order-number {
        font-size: 18px;
      }

      .poll-note {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-block">
      <h1 id="pageTitle">订单面板</h1>
      <p id="pageSubtitle">店内和线上到店付款订单统一显示在这里。</p>
    </div>
    <div class="topbar-right">
      <button id="langZhBtn" class="secondary-btn lang-btn active" onclick="setLanguage('zh')">中文</button>
      <button id="langFrBtn" class="secondary-btn lang-btn" onclick="setLanguage('fr')">FR</button>
      <div id="connectionStatus" class="status-badge disconnected">未连接</div>
    </div>
  </div>

  <div class="audio-controls">
    <strong id="audioLabel">声音提醒</strong>
    <button id="enableAudioBtn" class="primary-btn" onclick="enableAudio()">启用声音提醒</button>
    <button id="testSoundBtn" class="secondary-btn" onclick="testSound()" disabled>测试声音</button>
    <span id="audioStatus" class="audio-status">未启用</span>
    <audio id="alertSound" preload="auto">
      <source src="新订单.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="controls">
    <button id="refreshBtn" class="primary-btn" onclick="loadOrders()">手动刷新</button>
    <button id="toggleRealtimeBtn" class="secondary-btn" onclick="toggleRealtime()">切换实时</button>
    <span id="pollNote" class="poll-note">轮询每 60 秒一次，5 分钟无操作时暂停。</span>
  </div>

  <div id="orders" class="orders-grid">
    <div id="loadingText" class="empty-state">加载中...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const adminPassword = "88888888";
    const SUPABASE_URL = "https://jjkyltquurcuznukxakv.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KZezonRMvncSjXTgiSz-Kg_Ra2O4HhH";
    const POLLING_MS = 60000;
    const INACTIVITY_MS = 5 * 60 * 1000;

    const translations = {
      zh: {
        pageTitle: "订单面板",
        pageSubtitle: "店内和线上到店付款订单统一显示在这里。",
        connected: "实时连接",
        disconnected: "未连接",
        polling: "轮询模式",
        error: "连接错误",
        audioLabel: "声音提醒",
        enableAudioBtn: "启用声音提醒",
        testSoundBtn: "测试声音",
        audioDisabled: "未启用",
        audioEnabled: "已启用",
        audioEnabledWeb: "已启用（网页音频）",
        refreshBtn: "手动刷新",
        toggleRealtimeBtn: "切换实时",
        pollNote: "轮询每 60 秒一次，5 分钟无操作时暂停。",
        wrongPassword: "密码错误",
        enterPassword: "请输入管理员密码",
        newOrderTitle: "收到新订单",
        newOrderBody: "请查看订单面板",
        source_internal: "店内",
        source_online_paid: "线上已支付",
        source_online_pickup: "线上到店付款",
        status_new: "新订单",
        status_confirmed: "已确认",
        status_preparing: "制作中",
        status_ready: "可取餐",
        status_completed: "已完成",
        status_cancelled: "已取消",
        payment_unpaid: "未支付",
        payment_pay_on_pickup: "到店付款",
        payment_paid: "已支付",
        payment_failed: "支付失败",
        payment_refunded: "已退款",
        noOrders: "当前没有待处理订单",
        loading: "加载中...",
        loadFailed: "加载订单失败",
        noItems: "无商品",
        noNumber: "未生成订单号",
        total: "总价",
        customer: "姓名",
        phone: "电话",
        address: "地址",
        notes: "备注",
        emptyValue: "-",
        confirm: "确认",
        preparing: "制作中",
        ready: "可取餐",
        completed: "完成",
        statusUpdateFailed: "订单状态更新失败",
        supabaseUnavailable: "Supabase 不可用",
        orderLoadFailedLog: "加载订单失败",
        orderPollingFailedLog: "轮询订单失败",
        orderStatusFailedLog: "更新订单状态失败"
      },
      fr: {
        pageTitle: "Panneau de commandes",
        pageSubtitle: "Les commandes internes et en retrait sont affichees ici.",
        connected: "Temps reel",
        disconnected: "Deconnecte",
        polling: "Mode sondage",
        error: "Erreur reseau",
        audioLabel: "Alerte sonore",
        enableAudioBtn: "Activer le son",
        testSoundBtn: "Tester le son",
        audioDisabled: "Desactive",
        audioEnabled: "Active",
        audioEnabledWeb: "Active (audio web)",
        refreshBtn: "Rafraichir",
        toggleRealtimeBtn: "Basculer temps reel",
        pollNote: "Sondage toutes les 60 secondes, pause apres 5 minutes d'inactivite.",
        wrongPassword: "Mot de passe incorrect",
        enterPassword: "Entrez le mot de passe admin",
        newOrderTitle: "Nouvelle commande",
        newOrderBody: "Verifiez le panneau",
        source_internal: "Interne",
        source_online_paid: "En ligne payee",
        source_online_pickup: "Paiement sur place",
        status_new: "Nouvelle",
        status_confirmed: "Confirmee",
        status_preparing: "Preparation",
        status_ready: "Prete",
        status_completed: "Terminee",
        status_cancelled: "Annulee",
        payment_unpaid: "Non payee",
        payment_pay_on_pickup: "Paiement sur place",
        payment_paid: "Payee",
        payment_failed: "Paiement echoue",
        payment_refunded: "Remboursee",
        noOrders: "Aucune commande active",
        loading: "Chargement...",
        loadFailed: "Echec du chargement",
        noItems: "Aucun article",
        noNumber: "Sans numero",
        total: "Total",
        customer: "Client",
        phone: "Telephone",
        address: "Adresse",
        notes: "Remarques",
        emptyValue: "-",
        confirm: "Confirmer",
        preparing: "Preparation",
        ready: "Pret",
        completed: "Terminer",
        statusUpdateFailed: "Echec de mise a jour",
        supabaseUnavailable: "Supabase indisponible",
        orderLoadFailedLog: "Echec du chargement",
        orderPollingFailedLog: "Echec du sondage",
        orderStatusFailedLog: "Echec de mise a jour"
      }
    };

    let currentLang = "zh";
    let supabaseClient = null;
    let realtimeChannel = null;
    let isRealtimeMode = false;
    let isAudioEnabled = false;
    let audioContext = null;
    let pollingInterval = null;
    let lastOrderIds = new Set();
    let lastOrders = [];
    let isPollingPaused = false;
    let inactivityTimer = null;

    function t(key) {
      return translations[currentLang][key] || key;
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById("pageTitle").textContent = t("pageTitle");
      document.getElementById("pageSubtitle").textContent = t("pageSubtitle");
      document.getElementById("audioLabel").textContent = t("audioLabel");
      document.getElementById("enableAudioBtn").textContent = t("enableAudioBtn");
      document.getElementById("testSoundBtn").textContent = t("testSoundBtn");
      document.getElementById("refreshBtn").textContent = t("refreshBtn");
      document.getElementById("toggleRealtimeBtn").textContent = t("toggleRealtimeBtn");
      document.getElementById("pollNote").textContent = t("pollNote");
      document.getElementById("langZhBtn").classList.toggle("active", lang === "zh");
      document.getElementById("langFrBtn").classList.toggle("active", lang === "fr");
      document.getElementById("audioStatus").textContent = isAudioEnabled ? t("audioEnabled") : t("audioDisabled");
      renderOrders(lastOrders);
      refreshConnectionBadge();
    }

    function refreshConnectionBadge() {
      if (isRealtimeMode && realtimeChannel) {
        updateConnectionStatus("connected", t("connected"));
      } else if (isPollingPaused) {
        updateConnectionStatus("disconnected", t("polling"));
      } else if (pollingInterval) {
        updateConnectionStatus("connected", t("polling"));
      } else {
        updateConnectionStatus("disconnected", t("disconnected"));
      }
    }

    function updateConnectionStatus(status, text) {
      const statusEl = document.getElementById("connectionStatus");
      statusEl.className = `status-badge ${status}`;
      statusEl.textContent = text;
    }

    function handleActivity() {
      isPollingPaused = false;
      if (!isRealtimeMode && !pollingInterval) {
        startPolling();
      }
      refreshConnectionBadge();
      resetInactivityTimer();
    }

    function resetInactivityTimer() {
      if (inactivityTimer) {
        clearTimeout(inactivityTimer);
      }
      inactivityTimer = setTimeout(() => {
        if (!isRealtimeMode) {
          isPollingPaused = true;
          stopPolling();
          refreshConnectionBadge();
        }
      }, INACTIVITY_MS);
    }

    function initRealtime() {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        isRealtimeMode = true;
        refreshConnectionBadge();
      } catch (error) {
        console.warn("Supabase init failed, fallback to polling", error);
        isRealtimeMode = false;
        refreshConnectionBadge();
      }
    }

    function enableAudio() {
      const audio = document.getElementById("alertSound");
      const statusEl = document.getElementById("audioStatus");
      const testBtn = document.getElementById("testSoundBtn");

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      audio.volume = 1;
      const playPromise = audio.play();
      if (playPromise) {
        playPromise.then(() => {
          audio.pause();
          audio.currentTime = 0;
          isAudioEnabled = true;
          document.getElementById("enableAudioBtn").style.display = "none";
          testBtn.disabled = false;
          statusEl.textContent = t("audioEnabled");
        }).catch(() => {
          isAudioEnabled = true;
          testBtn.disabled = false;
          statusEl.textContent = t("audioEnabledWeb");
        });
      }
    }

    function playWebAudioAlert() {
      if (!audioContext || !isAudioEnabled) return;
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playAlertSound() {
      if (!isAudioEnabled) return;
      const audio = document.getElementById("alertSound");
      audio.currentTime = 0;
      audio.play().catch(() => playWebAudioAlert());
    }

    function testSound() {
      playAlertSound();
    }

    function showNewOrderAlert() {
      playAlertSound();
      if (document.visibilityState === "hidden" && "Notification" in window && Notification.permission === "granted") {
        new Notification(t("newOrderTitle"), {
          body: t("newOrderBody"),
          icon: "logo.png"
        });
      }
    }

    function getSourceLabel(source) {
      if (source === "internal") return t("source_internal");
      if (source === "online_paid") return t("source_online_paid");
      return t("source_online_pickup");
    }

    function getStatusLabel(status) {
      return t(`status_${status}`);
    }

    function getPaymentLabel(status) {
      return t(`payment_${status}`);
    }

    async function updateOrderStatus(id, orderStatus) {
      try {
        const res = await fetch("/api/mark-printed", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, order_status: orderStatus })
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || t("statusUpdateFailed"));
        }

        loadOrders();
      } catch (error) {
        console.error(t("orderStatusFailedLog"), error);
        alert(t("statusUpdateFailed"));
      }
    }

    function renderOrders(orders) {
      lastOrders = Array.isArray(orders) ? orders : [];
      const container = document.getElementById("orders");
      container.innerHTML = "";

      if (!lastOrders.length) {
        container.innerHTML = `<div class="empty-state">${t("noOrders")}</div>`;
        return;
      }

      const thirtySecondsAgo = Date.now() - 30000;

      lastOrders.forEach((order) => {
        const div = document.createElement("div");
        div.className = "order-card";

        if (new Date(order.created_at).getTime() > thirtySecondsAgo) {
          div.classList.add("new-order");
        }

        const items = Array.isArray(order.items) ? order.items : [];
        const itemHtml = items.length
          ? items.map((item) => `<li>${item.name} x${item.qty} - EUR ${Number(item.total ?? item.price * item.qty).toFixed(2)}</li>`).join("")
          : `<li>${t("noItems")}</li>`;

        div.innerHTML = `
          <div class="order-head">
            <div>
              <div class="order-number">${order.order_number || t("noNumber")}</div>
              <div class="order-meta">${new Date(order.created_at).toLocaleString(currentLang === "fr" ? "fr-FR" : "zh-CN")}</div>
            </div>
            <div class="order-extra">${t("total")} EUR ${Number(order.total_amount || 0).toFixed(2)}</div>
          </div>
          <div class="pill-row">
            <span class="pill pill-source">${getSourceLabel(order.source)}</span>
            <span class="pill pill-payment">${getPaymentLabel(order.payment_status)}</span>
            <span class="pill pill-status">${getStatusLabel(order.order_status)}</span>
          </div>
          <div class="order-extra">${t("customer")}: ${order.customer_name || t("emptyValue")}</div>
          <div class="order-extra">${t("phone")}: ${order.customer_phone || t("emptyValue")}</div>
          <div class="order-extra">${t("address")}: ${order.customer_address || t("emptyValue")}</div>
          <div class="order-extra">${t("notes")}: ${order.customer_notes || t("emptyValue")}</div>
          <ul class="item-list">${itemHtml}</ul>
          <div class="actions">
            <button class="btn-confirm" onclick="updateOrderStatus('${order.id}', 'confirmed')">${t("confirm")}</button>
            <button class="btn-preparing" onclick="updateOrderStatus('${order.id}', 'preparing')">${t("preparing")}</button>
            <button class="btn-ready" onclick="updateOrderStatus('${order.id}', 'ready')">${t("ready")}</button>
            <button class="btn-completed" onclick="updateOrderStatus('${order.id}', 'completed')">${t("completed")}</button>
          </div>
        `;

        container.appendChild(div);
      });
    }

    async function loadOrdersIfChanged() {
      try {
        const res = await fetch("/api/list-orders");
        const orders = await res.json();
        const currentIds = new Set(orders.map((order) => order.id));
        const newOrders = [...currentIds].filter((id) => !lastOrderIds.has(id));

        if (newOrders.length > 0) {
          showNewOrderAlert();
        }

        const changed =
          currentIds.size !== lastOrderIds.size ||
          [...currentIds].some((id) => !lastOrderIds.has(id));

        if (changed) {
          lastOrderIds = currentIds;
          renderOrders(orders);
        }
      } catch (error) {
        console.error(t("orderPollingFailedLog"), error);
        updateConnectionStatus("disconnected", t("error"));
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch("/api/list-orders");
        const orders = await res.json();
        lastOrderIds = new Set(orders.map((order) => order.id));
        renderOrders(orders);
      } catch (error) {
        console.error(t("orderLoadFailedLog"), error);
        document.getElementById("orders").innerHTML = `<div class="empty-state">${t("loadFailed")}</div>`;
      }
    }

    function setupRealtimeSubscription() {
      if (!supabaseClient) return;

      realtimeChannel = supabaseClient
        .channel("orders-channel")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "orders" }, () => {
          showNewOrderAlert();
          loadOrders();
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "orders" }, () => {
          loadOrders();
        })
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            isRealtimeMode = true;
            refreshConnectionBadge();
          } else if (status === "CHANNEL_ERROR") {
            isRealtimeMode = false;
            startPolling();
          }
        });
    }

    function startPolling() {
      stopPolling();
      if (isPollingPaused) {
        refreshConnectionBadge();
        return;
      }
      pollingInterval = setInterval(loadOrdersIfChanged, POLLING_MS);
      refreshConnectionBadge();
    }

    function stopPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
    }

    function toggleRealtime() {
      if (isRealtimeMode && realtimeChannel) {
        realtimeChannel.unsubscribe();
        realtimeChannel = null;
        isRealtimeMode = false;
        startPolling();
      } else if (supabaseClient) {
        stopPolling();
        isPollingPaused = false;
        setupRealtimeSubscription();
      } else {
        alert(t("supabaseUnavailable"));
      }
    }

    const input = prompt(translations.zh.enterPassword);
    if (input !== adminPassword) {
      alert(t("wrongPassword"));
      window.location.href = "https://cube-paris.vercel.app/";
    }

    ["mousemove", "mousedown", "keydown", "touchstart", "scroll"].forEach((eventName) => {
      window.addEventListener(eventName, handleActivity, { passive: true });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        handleActivity();
        loadOrders();
      }
    });

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    initRealtime();
    setLanguage("zh");
    loadOrders();
    resetInactivityTimer();

    if (isRealtimeMode) {
      setupRealtimeSubscription();
    } else {
      startPolling();
    }
  </script>
</body>
</html>
