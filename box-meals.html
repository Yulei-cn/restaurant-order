    let currentLang = "fr";

    function applyChannelCopyRules() {
      Object.values(pageData).forEach((langData) => {
        if (!Array.isArray(langData.sections)) return;
        langData.sections = langData.sections.map((section) => {
          if (typeof section?.info !== "string") {
            return section;
          }

          let info = section.info
            .replace("Uber Eats et PandaGo arrivent bientot.", "PandaGo et notre site de livraison en direct sont les canaux prevus.")
            .replace("Uber Eats 和 PandaGo 即将上线。", "我们目前只规划熊猫外卖和自营外卖网站。");

          return {
            ...section,
            info
          };
        });
      });
    }

    function renderOffers() {
      const slider = document.getElementById("offersSlider");
      const offers = pageData[currentLang].offers;
      slider.innerHTML = offers.map((offer) => `
        <div class="offer-card">
          <div class="offer-image">
            <img src="${offer.image}" alt="${offer.alt}" loading="lazy">
          </div>
          <div class="offer-content">
            <div class="offer-badge">${offer.badge}</div>
            <h3>${offer.title}</h3>
            <p>${offer.text}</p>
          </div>
        </div>
      `).join("");

    }

    function renderStorySections() {
      const container = document.getElementById("storySections");
      container.innerHTML = pageData[currentLang].sections.map((section) => `
        <div class="section">
          <h2>${section.title}</h2>
          <div class="section-content">
            ${section.body ? `<p>${section.body}</p>` : ""}
            ${section.info ? `<div class="info-box">📙 <strong>${section.info}</strong></div>` : ""}
            ${section.contacts ? `
              <div class="contact-info">
                ${section.contacts.map((contact) => `
                  <div class="contact-item">
                    <div class="contact-icon">${contact.icon}</div>
                    <div><strong>${contact.title}</strong><br>${contact.text.replace(/\n/g, "<br>")}</div>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `).join("");
    }

    function renderMenu() {
      const menu = pageData[currentLang].menu;
      const data = pageData[currentLang];
      const container = document.getElementById("menuSections");

      const formulasSection = `
        <div class="section">
          <h2>${menu.formulasTitle}</h2>
          <div class="section-content">
            <div class="formulas">
              ${menu.formulas.map((formula, index) => `
                <div class="formula-card">
                  <img class="formula-photo" src="Photo/Cube_Formule0${index + 1}.jpg" alt="" loading="lazy">
                  <div class="formula-details">
                    <div class="formula-title">${formula.title}</div>
                    <div class="formula-price">${formula.price}</div>
                    <div>${formula.desc}</div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;

      const groupOrderCard = Array.isArray(data.footerCards)
        ? data.footerCards.find((card) => {
            const title = String(card?.title || "").toLowerCase();
            return title.includes("groupe") || title.includes("团");
          })
        : null;

      const groupOrderSection = groupOrderCard ? `
        <div class="section catering-section">
          <h2>${groupOrderCard.title}</h2>
          <div class="section-content">
            <div class="info-box catering-highlight">
              <div class="catering-badge">${currentLang === "zh" ? "企业 / 团体订餐" : "Commande entreprise / groupe"}</div>
              <strong>${groupOrderCard.body.replace(/\n/g, "<br>")}</strong>
              <div class="catering-actions"><a class="button" href="tel:+33188614496">${currentLang === "zh" ? "电话咨询 ↗" : "Appelez-nous ↗"}</a><a href="mailto:cube.paris9@gmail.com">${currentLang === "zh" ? "发送邮件 ↗" : "Envoyer un email ↗"}</a></div>
            </div>
          </div>
        </div>
      ` : "";

      const standardSections = menu.sections.map((section) => `
        <div class="section">
          <h2>${section.title}</h2>
          <div class="section-content">
            <div class="menu-table">
              <div class="table-container">
                <table>
                  <tr><th>${menu.tableHeadName}</th><th>${menu.tableHeadPrice}</th></tr>
                  ${section.rows.map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join("")}
                </table>
              </div>
            </div>
          </div>
        </div>
      `).join("");

      const drinksSection = `
        <div class="section">
          <h2>${menu.drinksTitle}</h2>
          <div class="section-content">
            <p class="drinks-intro">
              ${menu.drinksIntro}
            </p>
            <ul class="drinks-list">
              ${menu.drinks.map((drink) => `<li>🥤 ${drink}</li>`).join("")}
            </ul>
          </div>
        </div>
      `;

      container.innerHTML = formulasSection + groupOrderSection + standardSections + drinksSection;
    }

    function renderFooter() {
      const data = pageData[currentLang];
      document.getElementById("footerTitle").textContent = data.footerTitle;
      document.getElementById("footerGrid").innerHTML = data.footerCards.map((card, index) => `
        <div class="footer-card">
          <div class="footer-title">${card.title}</div>
          <div class="footer-text">${card.body.replace(/\n/g, "<br>")}</div>
          ${card.linkLabel ? `
            <div class="footer-links">
              <a href="politique-confidentialite.html" target="_blank" rel="noopener">${card.linkLabel}</a>
            </div>
          ` : ""}
          ${card.meta ? `<div class="footer-meta">${card.meta}</div>` : ""}
        </div>
      `).join("");
    }

    function setLang(lang) {
      currentLang = lang;
      const data = pageData[lang];
      document.documentElement.lang = lang;
      document.title = lang === "zh" ? "CUBE 盒饭宣传页" : "Restaurant CUBE - Boites Repas & Menu";
      const copy = lang === "zh" ? {
        eyebrow: "巴黎九区 · 中式风味", title: "好好吃饭，\n就是好日常。",
        description: "一份热腾腾的中式盒饭，为忙碌的一天添点滋味。自由搭配，堂食或打包带走。",
        explore: "看看菜单 ↓", stamp: "你的午餐，\n自由搭配", call: "电话联系", directions: "到店导航"
      } : {
        eyebrow: "CUISINE CHINOISE · PARIS 9", title: "La pause déjeuner,\npleine de saveurs.",
        description: "Une boîte repas généreuse, à composer à votre goût. Les saveurs de la Chine, sur place ou à emporter.",
        explore: "Découvrir le menu ↓", stamp: "Votre pause,\nà votre goût", call: "Nous appeler", directions: "Itinéraire"
      };
      document.getElementById("heroTitle").textContent = copy.title;
      document.getElementById("heroEyebrow").textContent = copy.eyebrow;
      document.getElementById("heroDescription").textContent = copy.description;
      document.getElementById("exploreMenu").textContent = copy.explore;
      document.getElementById("heroStamp").textContent = copy.stamp;
      document.getElementById("vipNotice").textContent = data.vip;
      document.getElementById("contactActions").innerHTML = `<a href="tel:+33188614496">${copy.call} ↗</a><a href="https://www.google.com/maps/dir/?api=1&destination=7+rue+Blanche+75009+Paris" target="_blank" rel="noopener">${copy.directions} ↗</a>`;
      document.getElementById("contactActions").setAttribute("aria-label", lang === "zh" ? "联系与导航" : "Contact et itinéraire");
      document.getElementById("downloadBtn").textContent = data.download;
      document.getElementById("lang-fr").classList.toggle("active", lang === "fr");
      document.getElementById("lang-zh").classList.toggle("active", lang === "zh");

      renderOffers();
      renderStorySections();
      renderMenu();
      renderFooter();

      document.querySelectorAll(".lang-switch button").forEach(button => button.setAttribute("aria-pressed", button.id === `lang-${lang}`));
      try { localStorage.setItem("preferredLanguage", lang); } catch {}
    }

    window.addEventListener("load", () => {
      applyChannelCopyRules();
      let savedLang = "fr";
      try { savedLang = localStorage.getItem("preferredLanguage") || "fr"; } catch {}
      setLang(savedLang === "zh" ? "zh" : "fr");
    });
