<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBE - Commande</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="title">CUBE - Commande</h1>
      <div class="info-box" id="infoBox"></div>
    </div>

    <div class="lang-switch">
      <button id="lang-fr" type="button" onclick="setLang('fr')">Français</button>
      <button id="lang-zh" type="button" onclick="setLang('zh')">中文</button>
    </div>

    <div class="content">
      <form id="orderForm">
        <div id="menuCategories"></div>

        <div class="cart-summary">
          <div class="total-price"><span id="totalLabel"></span> <span id="total">0.00</span> EUR</div>
        </div>

        <div class="form-section">
          <h2 id="pickupInfoTitle"></h2>

          <div class="form-grid">
            <div class="form-field">
              <label for="customer_name" id="labelName"></label>
              <input type="text" name="customer_name" id="customer_name" required>
            </div>

            <div class="form-field">
              <label for="address" id="labelAddress"></label>
              <input type="text" name="address" id="address">
            </div>

            <div class="form-field">
              <label for="phone" id="labelPhone"></label>
              <input type="tel" name="phone" id="phone">
            </div>

            <div class="form-field">
              <label for="notes" id="labelNotes"></label>
              <input type="text" name="notes" id="notes">
            </div>

            <div class="anti-bot-field" aria-hidden="true">
              <label for="website">Website</label>
              <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <input type="hidden" id="form_started_at" name="form_started_at" value="">

            <button type="submit" class="submit-btn" id="submitBtn"></button>
          </div>
        </div>
      </form>

      <div id="result"></div>

      <div class="map-section">
        <h2 id="mapTitle"></h2>
        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d8826.566768564202!2d2.327968040327757!3d48.87434070843596!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66f9eb79f4ec3%3A0x8afbe2aac1fe8dd8!2sCUBE!5e0!3m2!1szh-CN!2sfr!4v1749454247270!5m2!1szh-CN!2sfr"
            width="100%"
            height="300"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
          </iframe>
        </div>
      </div>

      <div class="legal-section">
        <div class="legal-card">
          <h3 id="legalTitle"></h3>
          <p id="legalBody"></p>
          <a class="legal-link" id="legalLink" href="politique-confidentialite.html" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const i18n = {
      fr: {
        pageTitle: "🍱 CUBE - Commande",
        infoBox: "📍 7 Rue Blanche, 75009 Paris | 🕒 11:30-20:30",
        totalPrefix: "💵 Total :",
        pickupInfoTitle: "Informations de retrait",
        nameLabel: "Nom du client (obligatoire)",
        addressLabel: "Adresse (optionnel)",
        phoneLabel: "Telephone (optionnel)",
        notesLabel: "Remarques (optionnel)",
        mapTitle: "📍 Nous trouver",
        legalTitle: "Informations legales",
        legalBody: "CUBE, SAS au capital de 6 000,00 EUR, RCS Paris 928 586 973, siege social : 7 rue Blanche, 75009 Paris. Consultez les mentions legales et la politique de confidentialite pour les details sur l'editeur, les donnees traitees et vos droits.",
        legalLink: "Mentions legales et confidentialite",
        submitReady: "✅ Commander",
        submitDisabled: "Selectionnez des articles",
        submitLoading: "Envoi en cours...",
        decAria: "Diminuer",
        incAria: "Augmenter",
        emptyCart: "⚠️ Veuillez selectionner des articles",
        missingName: "⚠️ Veuillez remplir le nom",
        priceError: "❌ Erreur de validation du prix",
        networkError: "❌ Erreur reseau, veuillez reessayer",
        pickupTitle: "Commande enregistree, conservez votre numero",
        pickupLabel: "Votre numero de retrait",
        customerLabel: "Client",
        timeLabel: "Heure",
        totalLabel: "Total",
        paymentLabel: "Paiement",
        paymentValue: "Paiement sur place",
        pickupNote: "Presentez cette page ou indiquez ce numero au comptoir pour retirer votre commande."
      },
      zh: {
        pageTitle: "🍱 CUBE 盒饭点餐",
        infoBox: "📍 巴黎9区 Rue Blanche 7号 | 🕒 营业时间 11:30-20:30",
        totalPrefix: "💵 总计：",
        pickupInfoTitle: "订单信息",
        nameLabel: "姓名（必填）",
        addressLabel: "地址（可选）",
        phoneLabel: "电话（可选）",
        notesLabel: "备注（可选）",
        mapTitle: "📍 我们的位置",
        legalTitle: "法律与隐私信息",
        legalBody: "CUBE 为法国简化股份公司（SAS），注册资本 6 000,00 欧元，Paris RCS 编号 928 586 973，注册地址 7 rue Blanche, 75009 Paris。请查看法律声明与隐私政策页面，了解网站主体、数据处理和您的权利。",
        legalLink: "查看法律声明与隐私政策",
        submitReady: "✅ 提交订单",
        submitDisabled: "选择商品后提交",
        submitLoading: "提交中...",
        decAria: "减少",
        incAria: "增加",
        emptyCart: "⚠️ 请选择商品",
        missingName: "⚠️ 请填写姓名",
        priceError: "❌ 价格验证失败，请刷新重试",
        networkError: "❌ 网络错误，请重试",
        pickupTitle: "下单成功，请保存取餐号",
        pickupLabel: "您的取餐号",
        customerLabel: "姓名",
        timeLabel: "下单时间",
        totalLabel: "总金额",
        paymentLabel: "支付状态",
        paymentValue: "到店付款",
        pickupNote: "到店取餐时请向柜台出示此页面或报出取餐号。"
      }
    };

    const menuData = [
      {
        title: { fr: "🥗 Entrees", zh: "🥗 前菜" },
        items: [
          { id: "concombre", fr: "Concombre marine", zh: "拍黄瓜", server: "Concombre marine", price: 5.8 },
          { id: "radis", fr: "Radis aigre-doux", zh: "酸甜萝卜", server: "Radis aigre-doux", price: 5.8 },
          { id: "pommes", fr: "Pommes de terre rapees", zh: "凉拌土豆丝", server: "Pommes de terre rapees", price: 5.8 },
          { id: "algues", fr: "Algues marinees", zh: "海带丝", server: "Algues marinees", price: 5.8 }
        ]
      },
      {
        title: { fr: "🍲 Plats chauds", zh: "🍲 热菜" },
        items: [
          { id: "boeuf", fr: "Boeuf mijote", zh: "炖牛肉", server: "Boeuf mijote", price: 8.8 },
          { id: "porc_braise", fr: "Porc braise", zh: "红烧肉", server: "Porc braise", price: 8.8 },
          { id: "poulet_aigre_doux", fr: "Poulet aigre-doux", zh: "糖醋鸡", server: "Poulet aigre-doux", price: 8.8 },
          { id: "porc_croustillant", fr: "Porc saute croustillant", zh: "溜肉段", server: "Porc saute croustillant", price: 8.8 },
          { id: "poulet_frit", fr: "Poulet frit", zh: "炸鸡块", server: "Poulet frit", price: 8.8 },
          { id: "porc_frit", fr: "Porc frit croustillant", zh: "小酥肉", server: "Porc frit croustillant", price: 8.8 },
          { id: "kung_pao", fr: "Poulet Kung Pao", zh: "宫保鸡丁", server: "Poulet Kung Pao", price: 8.8 },
          { id: "aubergines", fr: "Aubergines braisees", zh: "烧茄子", server: "Aubergines braisees", price: 6.8 },
          { id: "haricots", fr: "Haricots verts sautes", zh: "干煸豆角", server: "Haricots verts sautes", price: 6.8 },
          { id: "oeufs_tomates", fr: "Oeufs aux tomates", zh: "番茄炒蛋", server: "Oeufs aux tomates", price: 6.8 }
        ]
      },
      {
        title: { fr: "🍚 Accompagnements", zh: "🍚 主食" },
        items: [
          { id: "riz_nature", fr: "Riz nature", zh: "米饭", server: "Riz nature", price: 2.5 },
          { id: "riz_saute", fr: "Riz saute", zh: "炒饭", server: "Riz saute", price: 5.8 },
          { id: "nouilles", fr: "Nouilles sautees", zh: "炒面", server: "Nouilles sautees", price: 6.8 }
        ]
      },
      {
        title: { fr: "🥙 Snacks", zh: "🥙 小吃" },
        items: [
          { id: "roujiamo_porc", fr: "Roujiamo porc", zh: "猪肉夹馍", server: "Roujiamo porc", price: 5.8 },
          { id: "roujiamo_boeuf", fr: "Roujiamo boeuf", zh: "牛肉夹馍", server: "Roujiamo boeuf", price: 6.8 }
        ]
      },
      {
        title: { fr: "🥤 Boissons", zh: "🥤 饮品" },
        items: [
          { id: "coca", fr: "Coca-Cola", zh: "可乐", server: "Coca-Cola", price: 2.0 },
          { id: "sprite", fr: "Sprite", zh: "雪碧", server: "Sprite", price: 2.0 },
          { id: "fanta", fr: "Fanta", zh: "芬达", server: "Fanta", price: 2.0 },
          { id: "peach_tea", fr: "The a la peche", zh: "桃茶", server: "The a la peche", price: 2.0 },
          { id: "orange_juice", fr: "Jus d'orange", zh: "橙汁", server: "Jus d'orange", price: 2.0 },
          { id: "water", fr: "Eau minerale", zh: "矿泉水", server: "Eau minerale", price: 2.0 }
        ]
      },
      {
        title: { fr: "🍱 Formules", zh: "🍱 套餐" },
        items: [
          {
            id: "formule1",
            fr: "Formule 1",
            zh: "套餐 1",
            server: "Formule 1",
            price: 11.8,
            desc: {
              fr: "Riz ou nouilles sautees (+1,00 EUR), 1 entree, 2 plats chauds. Boisson en supplement : +1,00 EUR.",
              zh: "米饭或炒面（加 1,00 EUR），1 份前菜，2 份热菜。饮品另加 1,00 EUR。"
            }
          },
          {
            id: "formule2",
            fr: "Formule 2",
            zh: "套餐 2",
            server: "Formule 2",
            price: 13.8,
            desc: {
              fr: "Riz ou nouilles sautees (+1,00 EUR), 1 entree, 3 plats chauds. Boisson en supplement : +1,00 EUR.",
              zh: "米饭或炒面（加 1,00 EUR），1 份前菜，3 份热菜。饮品另加 1,00 EUR。"
            }
          }
        ]
      }
    ];

    const itemIndex = Object.fromEntries(
      menuData.flatMap((category) => category.items.map((item) => [item.id, item]))
    );

    let currentLang = "fr";
    let cart = {};
    let lastPickupData = null;
    let formStartedAt = Date.now();

    function t(key) {
      return i18n[currentLang][key];
    }

    function calculateTotal() {
      return Object.entries(cart).reduce((sum, [itemId, qty]) => {
        const item = itemIndex[itemId];
        return item ? sum + item.price * qty : sum;
      }, 0);
    }

    function updateTotal() {
      document.getElementById("total").textContent = calculateTotal().toFixed(2);
    }

    function updateCartSummary() {
      const totalItems = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      const submitBtn = document.getElementById("submitBtn");

      if (totalItems === 0) {
        submitBtn.disabled = true;
        submitBtn.textContent = t("submitDisabled");
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = t("submitReady");
      }
    }

    function renderCategories() {
      const container = document.getElementById("menuCategories");
      container.innerHTML = "";

      menuData.forEach((category) => {
        const section = document.createElement("div");
        section.className = "category";
        section.innerHTML = `
          <h2>${category.title[currentLang]}</h2>
          <div class="menu-grid">
            ${category.items.map((item) => `
              <div class="menu-item">
                <div class="item-info">
                  <div class="item-name">${item[currentLang]}</div>
                  <div class="item-price">${item.price.toFixed(2)} EUR</div>
                  ${item.desc ? `<div class="item-desc">${item.desc[currentLang]}</div>` : ""}
                </div>
                <div class="item-controls">
                  <button type="button" class="qty-button" onclick="changeQty('${item.id}', -1)" aria-label="${t("decAria")}">-</button>
                  <div class="qty-display" id="qty-${item.id}">${cart[item.id] || 0}</div>
                  <button type="button" class="qty-button" onclick="changeQty('${item.id}', 1)" aria-label="${t("incAria")}">+</button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
        container.appendChild(section);
      });
    }

    function updateStaticTexts() {
      document.documentElement.lang = currentLang;
      document.title = currentLang === "zh" ? "CUBE 盒饭点餐" : "CUBE - Commande";
      document.getElementById("title").textContent = t("pageTitle");
      document.getElementById("infoBox").textContent = t("infoBox");
      document.getElementById("totalLabel").textContent = t("totalPrefix");
      document.getElementById("pickupInfoTitle").textContent = t("pickupInfoTitle");
      document.getElementById("labelName").textContent = t("nameLabel");
      document.getElementById("labelAddress").textContent = t("addressLabel");
      document.getElementById("labelPhone").textContent = t("phoneLabel");
      document.getElementById("labelNotes").textContent = t("notesLabel");
      document.getElementById("mapTitle").textContent = t("mapTitle");
      document.getElementById("legalTitle").textContent = t("legalTitle");
      document.getElementById("legalBody").textContent = t("legalBody");
      document.getElementById("legalLink").textContent = t("legalLink");
      document.getElementById("lang-fr").classList.toggle("active", currentLang === "fr");
      document.getElementById("lang-zh").classList.toggle("active", currentLang === "zh");
    }

    function changeQty(itemId, delta) {
      cart[itemId] = Math.max(0, (cart[itemId] || 0) + delta);
      const qtyElement = document.getElementById(`qty-${itemId}`);
      if (qtyElement) {
        qtyElement.textContent = cart[itemId];
      }
      updateTotal();
      updateCartSummary();
    }

    function getPickupContent(data, clientTotal, customerName) {
      return {
        title: t("pickupTitle"),
        pickupLabel: t("pickupLabel"),
        customerLabel: t("customerLabel"),
        timeLabel: t("timeLabel"),
        totalLabel: t("totalLabel"),
        paymentLabel: t("paymentLabel"),
        paymentValue: t("paymentValue"),
        note: t("pickupNote"),
        customerName: customerName || "-",
        orderTime: new Date().toLocaleString(currentLang === "zh" ? "zh-CN" : "fr-FR"),
        serverTotal: Number(data.serverTotal || clientTotal || 0).toFixed(2)
      };
    }

    function showPickupResult(data, clientTotal, customerName) {
      const resultDiv = document.getElementById("result");
      const content = getPickupContent(data, clientTotal, customerName);

      resultDiv.className = "pickup-card";
      resultDiv.innerHTML = `
        <h3>✅ ${content.title}</h3>
        <div class="pickup-number">
          <div class="pickup-number-label">${content.pickupLabel}</div>
          <div class="pickup-number-value">${data.orderNumber || "---"}</div>
        </div>
        <div class="pickup-grid">
          <div class="pickup-item">
            <strong>${content.customerLabel}</strong>
            <span>${content.customerName}</span>
          </div>
          <div class="pickup-item">
            <strong>${content.timeLabel}</strong>
            <span>${content.orderTime}</span>
          </div>
          <div class="pickup-item">
            <strong>${content.totalLabel}</strong>
            <span>EUR ${content.serverTotal}</span>
          </div>
          <div class="pickup-item">
            <strong>${content.paymentLabel}</strong>
            <span>${content.paymentValue}</span>
          </div>
        </div>
        <div class="pickup-note">${content.note}</div>
      `;

      lastPickupData = { data, clientTotal, customerName };
      resultDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function showResult(message, type) {
      lastPickupData = null;
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = message;
      resultDiv.className = `result-message ${type}`;
      resultDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function setLang(lang) {
      currentLang = lang;
      updateStaticTexts();
      renderCategories();
      updateTotal();
      updateCartSummary();

      if (lastPickupData) {
        showPickupResult(lastPickupData.data, lastPickupData.clientTotal, lastPickupData.customerName);
      }
    }

    function resetFormProtection() {
      formStartedAt = Date.now();
      document.getElementById("form_started_at").value = String(formStartedAt);
      document.getElementById("website").value = "";
    }

    document.getElementById("orderForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const items = [];
      let clientTotal = 0;

      for (const [itemId, qty] of Object.entries(cart)) {
        if (qty > 0) {
          const item = itemIndex[itemId];
          if (!item) continue;
          items.push({ name: item.server, qty, price: item.price });
          clientTotal += item.price * qty;
        }
      }

      if (items.length === 0) {
        showResult(t("emptyCart"), "error");
        return;
      }

      const customerName = document.getElementById("customer_name").value.trim();
      if (!customerName) {
        showResult(t("missingName"), "error");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = t("submitLoading");

      try {
        const res = await fetch("/api/submit-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer_name: customerName,
            items,
            address: document.getElementById("address").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            notes: document.getElementById("notes").value.trim(),
            website: document.getElementById("website").value,
            form_started_at: document.getElementById("form_started_at").value,
            source: "online_pickup",
            channel: "web",
            fulfillment_type: "pickup",
            payment_status: "pay_on_pickup"
          })
        });

        const data = await res.json();

        if (res.ok) {
          if (data.serverTotal && Math.abs(data.serverTotal - clientTotal) > 0.01) {
            showResult(t("priceError"), "error");
            return;
          }

          cart = {};
          document.getElementById("orderForm").reset();
          renderCategories();
          updateTotal();
          updateCartSummary();
          resetFormProtection();
          showPickupResult(data, clientTotal, customerName);
        } else {
          showResult(`❌ ${data.error}`, "error");
        }
      } catch (error) {
        showResult(t("networkError"), "error");
      } finally {
        updateCartSummary();
      }
    });

    setLang("fr");
    resetFormProtection();
    document.addEventListener("touchstart", function () {}, { passive: true });
  </script>
</body>
</html>
