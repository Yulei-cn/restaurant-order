  <div class="container">
    <div class="cashier-toolbar">
      <div class="cashier-day-actions">
        <button class="cashier-day-action cashier-day-action--open" id="openDayButton" type="button" onclick="openCashDay()"></button>

      </div>
      <div class="lang-switch">
        <button id="lang-fr" type="button" onclick="setLang('fr')">Français</button>
        <button id="lang-zh" type="button" onclick="setLang('zh')">中文</button>
      </div>
    </div>

    <div class="content">
      <form id="orderForm">
        <div class="cart-summary cashier-summary">
          <div class="total-price"><span id="totalLabel"></span> <span id="total">0.00</span> EUR</div>
          <button type="submit" class="submit-btn" id="submitBtn"></button>
        </div>

        <div id="menuCategories"></div>

        <div class="anti-bot-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <input type="hidden" id="form_started_at" name="form_started_at" value="">
      </form>

      <div id="result"></div>
      <section id="printReceipt" class="print-receipt" aria-hidden="true"></section>
    </div>
  </div>

          { id: "riz_nature", fr: "Riz nature", zh: "米饭", server: "Riz nature", price: 2.5 },

        ]

    const itemIndex = Object.fromEntries(
      menuData.flatMap((category) => category.items.map((item) => [item.id, item]))
    );

    let currentLang = "fr";
    let cart = {};
    let lastPickupData = null;
    let lastReceiptData = null;
    let currentCashierOrder = null;
    let formStartedAt = Date.now();

    function t(key) {
      return i18n[currentLang][key];
    }

    function calculateTotal() {
      return Object.entries(cart).reduce((sum, [itemId, qty]) => {
        const item = itemIndex[itemId];
        return item ? sum + item.price * qty : sum;
      }, 0);
    }

    function updateTotal() {
      document.getElementById("total").textContent = calculateTotal().toFixed(2);
    }

    function updateCartSummary() {
      const totalItems = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      const submitBtn = document.getElementById("submitBtn");

      if (totalItems === 0) {
        submitBtn.disabled = true;
        submitBtn.textContent = t("submitDisabled");
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = t("submitReady");
      }
    }

    function renderCategories() {
      const container = document.getElementById("menuCategories");
      container.innerHTML = "";

      menuData.forEach((category) => {
        const section = document.createElement("div");
        section.className = `category${category.kind ? ` category--${category.kind}` : ""}`;
        const formulaQuickOrder = ["roujiamo_porc", "roujiamo_boeuf", "formule_nouilles", "formule_boisson"];
        const displayItems = category.kind === "formules"
          ? [...category.items].sort((left, right) => {
            const leftPosition = formulaQuickOrder.indexOf(left.id);
            const rightPosition = formulaQuickOrder.indexOf(right.id);
            if (leftPosition === -1 && rightPosition === -1) return 0;
            if (leftPosition === -1) return -1;
            if (rightPosition === -1) return 1;
            return leftPosition - rightPosition;
          })
          : category.items;
        section.innerHTML = `
          <h2>${category.title[currentLang]}</h2>
          <div class="menu-grid">
            ${displayItems.map((item) => `
              <div class="menu-item${item.type ? ` menu-item--${item.type}` : ""}">
                <div class="item-info">
                  <div class="item-name">${item[currentLang]}</div>
                  <div class="item-price">${item.addOn ? "+" : ""}${item.price.toFixed(2)} EUR</div>
                  ${item.desc ? `<div class="item-desc">${item.desc[currentLang]}</div>` : ""}
                </div>
                <div class="item-controls">
                  <button type="button" class="qty-button" onclick="changeQty('${item.id}', -1)" aria-label="${t("decAria")}">-</button>
                  <div class="qty-display" id="qty-${item.id}">${cart[item.id] || 0}</div>
                  <button type="button" class="qty-button" onclick="changeQty('${item.id}', 1)" aria-label="${t("incAria")}">+</button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
        container.appendChild(section);
      });
    }

    function updateStaticTexts() {
      document.documentElement.lang = currentLang;
      document.title = t("pageTitle");
      document.getElementById("totalLabel").textContent = t("totalPrefix");
      document.getElementById("openDayButton").textContent = t("openDay");
      document.getElementById("closeDayButton").textContent = t("closeDay");
      document.getElementById("lang-fr").classList.toggle("active", currentLang === "fr");
      document.getElementById("lang-zh").classList.toggle("active", currentLang === "zh");
    }

    function changeQty(itemId, delta) {
      cart[itemId] = Math.max(0, (cart[itemId] || 0) + delta);
      const qtyElement = document.getElementById(`qty-${itemId}`);
      if (qtyElement) {
        qtyElement.textContent = cart[itemId];
      }
      updateTotal();
      updateCartSummary();
    }

    function getPickupContent(data, clientTotal, customerName, orderTime) {
      return {
        title: t("pickupTitle"),
        pickupLabel: t("pickupLabel"),
        customerLabel: t("customerLabel"),
        timeLabel: t("timeLabel"),
        totalLabel: t("totalLabel"),
        paymentLabel: t("paymentLabel"),
        paymentValue: t("paymentValue"),
        note: t("pickupNote"),
        customerName: customerName || "-",
        orderTime: orderTime || new Date().toLocaleString(currentLang === "zh" ? "zh-CN" : "fr-FR"),
        serverTotal: Number(data.serverTotal || clientTotal || 0).toFixed(2)
      };
    }

    function showPickupResult(data, clientTotal, customerName, orderTime) {
      const resultDiv = document.getElementById("result");
      const content = getPickupContent(data, clientTotal, customerName, orderTime);

      resultDiv.className = "pickup-card";
      resultDiv.innerHTML = `
        <h3>✅ ${content.title}</h3>
        <div class="pickup-number">
          <div class="pickup-number-label">${content.pickupLabel}</div>
          <div class="pickup-number-value">${data.orderNumber || "---"}</div>
        </div>
        <div class="pickup-grid">
          <div class="pickup-item">
            <strong>${content.customerLabel}</strong>
            <span>${content.customerName}</span>
          </div>
          <div class="pickup-item">
            <strong>${content.timeLabel}</strong>
            <span>${content.orderTime}</span>
          </div>
          <div class="pickup-item">
            <strong>${content.totalLabel}</strong>
            <span>EUR ${content.serverTotal}</span>
          </div>
          <div class="pickup-item">
            <strong>${content.paymentLabel}</strong>
            <span>${content.paymentValue}</span>
          </div>
        </div>
        <div class="pickup-note">${content.note}</div>
        ${data.paymentStatus === "paid" ? "" : `
          <div class="payment-panel">
            <h4>${t("paymentPanelTitle")}</h4>
            <div class="payment-quick-actions">
              <button type="button" class="payment-choice cash" onclick="recordPayment('cash')">💶 ${t("methodCash")}</button>
              <button type="button" class="payment-choice card" onclick="recordPayment('card')">💳 ${t("methodCard")}</button>
              <button type="button" class="payment-choice voucher" onclick="recordPayment('meal_voucher')">🍽️ ${t("methodVoucher")}</button>
              <button type="button" class="payment-choice other" onclick="recordPayment('other')">${t("methodOther")}</button>
            </div>
            <label class="terminal-reference">${t("terminalReference")}
              <input id="terminalReference" type="text" maxlength="100">
            </label>
          </div>
        `}
        ${data.paymentStatus === "paid" ? `<div class="cashier-after-payment-actions">
          <button type="button" class="reprint-btn" onclick="printLastReceipt()">${t("reprint")}</button>
          <button type="button" class="next-order-btn" onclick="startNextOrder()">${t("nextOrder")}</button>
        </div>` : ""}
      `;

      lastPickupData = { data, clientTotal, customerName, orderTime: content.orderTime };
      currentCashierOrder = data;
      resultDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        "\"": "&quot;"
      }[character]));
    }

    function displayItemName(serverName) {
      const item = Object.values(itemIndex).find((entry) => entry.server === serverName);
      return item ? item[currentLang] : serverName;
    }

    function renderReceipt(receipt) {
      const receiptElement = document.getElementById("printReceipt");
      const totalTtc = Number(receipt.serverTotal);
      const totalHt = totalTtc / 1.1;
      const vatAmount = totalTtc - totalHt;
      const paymentLabel = receipt.paymentMethod
        ? t({ cash: "methodCash", card: "methodCard", meal_voucher: "methodVoucher", other: "methodOther" }[receipt.paymentMethod])
        : "-";
      const itemRows = receipt.items.map((item) => `
        <div class="receipt-item">
          <span>${item.qty}  ${escapeHtml(displayItemName(item.name))}</span>
          <span>EUR ${item.price.toFixed(2)}</span>
          <span>EUR ${(item.qty * item.price).toFixed(2)}</span>
        </div>
      `).join("");

      receiptElement.innerHTML = `
        <div class="receipt-brand">CUBE</div>
        <p class="receipt-legal">CUBE<br>${t("receiptLegal")}</p>
        <h1>${t("receiptTitle")}</h1>
        <div class="receipt-meta"><span>${escapeHtml(receipt.data.orderNumber || "---")}</span><span>${escapeHtml(receipt.orderTime)}</span></div>
        <p>${t("receiptSeller")}</p>
        <div class="receipt-rule"></div>
        <p class="receipt-table-head">${t("receiptItemHeader")}</p>
        ${itemRows}
        <div class="receipt-rule"></div>
        <div class="receipt-summary"><span>${t("receiptLineCount")} : ${receipt.items.length}</span></div>
        <div class="receipt-summary"><span>${t("receiptGrossTotal")}</span><span>EUR ${totalTtc.toFixed(2)}</span></div>
        <div class="receipt-summary"><span>${t("receiptDiscount")}</span><span>EUR 0.00</span></div>
        <div class="receipt-total"><span>${t("receiptNetTotal")}</span><span>EUR ${totalTtc.toFixed(2)}</span></div>
        <div class="receipt-summary"><span>${paymentLabel}</span><span>1 × EUR ${totalTtc.toFixed(2)}</span></div>
        <div class="receipt-total"><span>${t("receiptChange")}</span><span>EUR 0.00</span></div>
        <div class="receipt-rule"></div>
        <p class="receipt-table-head">${t("receiptVatHeader")}</p>
        <div class="receipt-summary"><span>10%</span><span>EUR ${totalHt.toFixed(2)}</span><span>EUR ${vatAmount.toFixed(2)}</span><span>EUR ${totalTtc.toFixed(2)}</span></div>
        <div class="receipt-rule"></div>
        <p class="receipt-thanks">${t("receiptThanks")}</p>
      `;
    }

    function printLastReceipt() {
      if (!lastReceiptData) return;
      renderReceipt(lastReceiptData);
      try {
        window.print();
      } catch {
        // Printing is non-blocking: the order and payment are already recorded.
      }
    }

    function startNextOrder() {
      lastPickupData = null;
      lastReceiptData = null;
      currentCashierOrder = null;
      const resultDiv = document.getElementById("result");
      resultDiv.className = "";
      resultDiv.innerHTML = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function updateCashDay(action) {
      const button = document.getElementById(action === "open" ? "openDayButton" : "closeDayButton");
      button.disabled = true;
      try {
        const res = await fetch("/api/cash-register", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action,
            opening_cash: 0,
            counted_cash: 0
          })
        });
        const data = await res.json();
        if (res.status === 401) {
          window.location.href = "admin.html?next=index.html";
          return false;
        }
        if (!res.ok) throw new Error(data.error || "Operation impossible");
        return true;
      } catch (error) {
        alert(`${t("dayError")} : ${error.message || "inconnue"}`);
        return false;
      } finally {
        button.disabled = false;
      }
    }

    let cashDayStatus = "not_started";

    async function refreshCashDayState() {
      try {
        const res = await fetch("/api/cash-register", { credentials: "same-origin" });
        if (res.status === 401) {
          window.location.href = "admin.html?next=index.html";
          return;
        }
        const data = await res.json();
        if (!res.ok) return;
        const status = data.day_state || "not_started";
        cashDayStatus = status;
        const openButton = document.getElementById("openDayButton");
        const closeButton = document.getElementById("closeDayButton");
        openButton.disabled = status === "open";
        closeButton.disabled = status !== "open";
        openButton.textContent = t(status === "closed" ? "reopenDay" : "openDay");
        document.getElementById("cashDayStatus").textContent = t(
          status === "open" ? "dayOpen" : status === "closed" ? "dayClosed" : "dayNotStarted"
        );
      } catch {
        // Session validation below handles unavailable authenticated access.
      }
    }

    async function openCashDay() {
      const wasClosed = cashDayStatus === "closed";
      if (await updateCashDay("open")) {
        await refreshCashDayState();
        alert(t(wasClosed ? "dayReopened" : "dayOpened"));
      }
    }

    async function closeCashDay() {
      if (await updateCashDay("close")) {
        window.location.href = "cash-register.html";
      }
    }

    async function recordPayment(paymentMethod) {
      if (!currentCashierOrder?.orderId) return;
      const buttons = document.querySelectorAll(".payment-choice");
      const amount = Number(lastReceiptData.serverTotal);
      buttons.forEach((button) => { button.disabled = true; });
      try {
        const res = await fetch("/api/cash-register", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "payment",
            order_id: currentCashierOrder.orderId,
            payment_method: paymentMethod,
            amount,
            terminal_reference: document.getElementById("terminalReference").value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        currentCashierOrder.paymentStatus = data.result.payment_status;
        lastReceiptData.paymentMethod = paymentMethod;
        showPickupResult(currentCashierOrder, lastReceiptData.serverTotal, lastReceiptData.customerName, lastReceiptData.orderTime);
      } catch (error) {
        buttons.forEach((button) => { button.disabled = false; });
        alert(`${t("paymentError")} : ${error.message || "inconnue"}`);
      }
    }

    function showResult(message, type) {
      lastPickupData = null;
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = message;
      resultDiv.className = `result-message ${type}`;
      resultDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function setLang(lang) {
      currentLang = lang;
      updateStaticTexts();
      renderCategories();
      updateTotal();
      updateCartSummary();

      if (lastPickupData) {
        showPickupResult(lastPickupData.data, lastPickupData.clientTotal, lastPickupData.customerName, lastPickupData.orderTime);
      }
      if (lastReceiptData) {
        renderReceipt(lastReceiptData);
      }
      refreshCashDayState();
    }

    function resetFormProtection() {
      formStartedAt = Date.now();
      document.getElementById("form_started_at").value = String(formStartedAt);
      document.getElementById("website").value = "";
    }

    document.getElementById("orderForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const items = [];
      let clientTotal = 0;

      for (const [itemId, qty] of Object.entries(cart)) {
        if (qty > 0) {
          const item = itemIndex[itemId];
          if (!item) continue;
          items.push({ name: item.server, qty, price: item.price });
          clientTotal += item.price * qty;
        }
      }

      if (items.length === 0) {
        showResult(t("emptyCart"), "error");
        return;
      }

      const customerName = t("counterCustomer");

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = t("submitLoading");

      try {
        const res = await fetch("/api/submit-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer_name: customerName,
            items,
            website: document.getElementById("website").value,
            form_started_at: document.getElementById("form_started_at").value,
            source: "internal",
            channel: "staff",
            fulfillment_type: "pickup",
            payment_status: "pay_on_pickup"
          })
        });

        const data = await res.json();

        if (res.status === 401) {
          window.location.href = "admin.html?next=index.html";
          return;
        }

        if (res.ok) {
          if (data.serverTotal && Math.abs(data.serverTotal - clientTotal) > 0.01) {
            showResult(t("priceError"), "error");
            return;
          }

          const orderTime = new Date().toLocaleString(currentLang === "zh" ? "zh-CN" : "fr-FR");
          lastReceiptData = {
            data,
            customerName,
            orderTime,
            items,
            serverTotal: data.serverTotal || clientTotal
          };

          cart = {};
          document.getElementById("orderForm").reset();
          renderCategories();
          updateTotal();
          updateCartSummary();
          resetFormProtection();
          showPickupResult(data, clientTotal, customerName, orderTime);
        } else {
          showResult(`❌ ${data.error}`, "error");
        }
      } catch (error) {
        showResult(t("networkError"), "error");
      } finally {
        updateCartSummary();
      }
    });

    setLang("fr");
    resetFormProtection();
    refreshCashDayState();
    fetch("/api/admin-session", { credentials: "same-origin" })
      .then((res) => res.json())
      .then((data) => {
        if (!data.authenticated) window.location.href = "admin.html?next=index.html";
      })
      .catch(() => { window.location.href = "admin.html?next=index.html"; });
    document.addEventListener("touchstart", function () {}, { passive: true });
  </script>
</body>
</html>
